name: Build Sanity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate pyproject and citation
        run: |
          python -m pip install --upgrade pip tomli pyyaml
          python -c "import tomli; tomli.load(open('pyproject.toml','rb')); print('pyproject OK')"
          python -c "import yaml; yaml.safe_load(open('CITATION.cff')); print('CITATION OK')"
