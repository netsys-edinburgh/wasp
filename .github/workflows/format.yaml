name: Formatting

on:
  workflow_dispatch:
  pull_request:
    branches:
      '**'
  merge_group:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # formatting and basic install on cpu-only machine
  unit-tests:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: environment
        run: |
          which python
          python --version

      - name: Install dependencies
        run: |
          # Install only lint tools; the project dependencies include
          # the Morphling training runtime and are not needed for formatting.
          python -m pip install -r requirements-lint.txt

      - name: Formatting checks
        run: |
          python -m pip show pre-commit
          pre-commit run --all-files
